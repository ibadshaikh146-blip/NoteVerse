<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteVerse - Admin Control Center</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wider text-indigo-400">NoteVerse ADMIN</span>
        </div>
        <a href="index.jsp" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition">Back to Site</a>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        
        <h1 class="text-3xl font-extrabold mb-6 text-white">Platform Moderation Dashboard</h1>

        <!-- Pending Notes Section -->
        <div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-xl font-semibold text-indigo-300">Pending Notes Queue</h2>
                <button onclick="loadPendingNotes()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded transition">Refresh</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700/50 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="px-6 py-3">Title / Details</th>
                            <th class="px-6 py-3">Semester</th>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTableBody" class="divide-y divide-gray-700">
                        <!-- Student Directory / User Management Section -->
<div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700 mt-8">
    <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
        <h2 class="text-xl font-semibold text-indigo-300">Registered Students Directory</h2>
        <button onclick="loadUsers()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded transition">Refresh Users</button>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-700/50 text-gray-400 text-xs uppercase tracking-wider">
                    <th class="px-6 py-3">Full Name</th>
                    <th class="px-6 py-3">Email</th>
                    <th class="px-6 py-3">Role</th>
                    <th class="px-6 py-3 text-center">Manage Role / Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody" class="divide-y divide-gray-700">
                <tr>
                    <td colspan="4" class="px-6 py-6 text-center text-gray-500">Loading users...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
                        <!-- Dynamic rows injected via JavaScript -->
                        <tr>
                            <td colspan="4" class="px-6 py-6 text-center text-gray-500">Loading pending notes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PDF Preview Modal -->
    <div id="previewModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl w-full max-w-4xl h-[80vh] flex flex-col border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 bg-gray-700 flex justify-between items-center">
                <h3 class="font-semibold text-lg text-white">PDF Preview</h3>
                <button onclick="closePreview()" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            <div class="flex-1 bg-gray-900 p-2">
                <iframe id="pdfViewerFrame" class="w-full h-full rounded border-0"></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadPendingNotes();
        });

        function loadPendingNotes() {
            fetch('admin/pending-notes')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('pendingTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">No pending notes waiting for approval. Great job!</td></tr>`;
                        return;
                    }

                    data.forEach(note => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-700/30 transition";
                        tr.innerHTML = `
                            <td class="px-6 py-4">
                                <div class="font-bold text-white">\${note.title}</div>
                                <div class="text-sm text-gray-400">\${note.description || 'No description provided.'}</div>
                            </td>
                            <td class="px-6 py-4 text-gray-300">Sem \${note.semester}</td>
                            <td class="px-6 py-4">
                                <span class="bg-indigo-900/50 text-indigo-300 border border-indigo-700 text-xs px-2.5 py-1 rounded-full">\${note.noteType}</span>
                            </td>
                            <td class="px-6 py-4 text-center space-x-2">
                                <button onclick="previewPdf('\${note.filePath}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded transition">Preview</button>
                                <button onclick="moderateNote(\${note.noteId}, 'APPROVE')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded transition">Approve</button>
                                <button onclick="moderateNote(\${note.noteId}, 'DELETE')" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-1.5 rounded transition">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Error fetching pending notes:', err);
                    document.getElementById('pendingTableBody').innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-rose-400">Failed to load pending notes.</td></tr>`;
                });
        }

        function moderateNote(noteId, action) {
            if (!confirm(`Are you sure you want to \${action.toLowerCase()} this note?`)) return;

            const formData = new URLSearchParams();
            formData.append('noteId', noteId);
            formData.append('action', action);

            fetch('admin/moderate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    loadPendingNotes(); // Refresh list
                } else {
                    alert('Action failed: ' + result.message);
                }
            })
            .catch(err => alert('Network error occurred.'));
        }

        function previewPdf(filePath) {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = filePath; // Points directly to the local server storage path
            modal.classList.remove('hidden');
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = '';
            modal.classList.add('hidden');
        }
        // Load users on page startup
document.addEventListener("DOMContentLoaded", () => {
    loadPendingNotes();
    loadUsers();
});

function loadUsers() {
    fetch('admin/users')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">No registered users found.</td></tr>`;
                return;
            }

            data.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-700/30 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-white">\${user.fullName}</td>
                    <td class="px-6 py-4 text-gray-300">\${user.email}</td>
                    <td class="px-6 py-4">
                        <span class="bg-gray-700 text-indigo-300 text-xs px-2.5 py-1 rounded-full">\${user.role}</span>
                    </td>
                    <td class="px-6 py-4 text-center space-x-2">
                        <button onclick="toggleRole(\${user.userId}, '\${user.role}')" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-1.5 rounded transition">Toggle Role</button>
                        <button onclick="deleteUser(\${user.userId})" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-1.5 rounded transition">Remove</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => console.error('Error fetching users:', err));
}

function toggleRole(userId, currentRole) {
    const newRole = currentRole === 'ADMIN' ? 'STUDENT' : 'ADMIN';
    if (!confirm(`Change user role to \${newRole}?`)) return;

    const formData = new URLSearchParams();
    formData.append('userId', userId);
    formData.append('action', 'UPDATE_ROLE');
    formData.append('role', newRole);

    fetch('admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    })
    .then(res => res.json())
    .then(result => {
        if (result.success) loadUsers();
        else alert('Failed to update role.');
    });
}

function deleteUser(userId) {
    if (!confirm('Are you sure you want to delete this user account?')) return;

    const formData = new URLSearchParams();
    formData.append('userId', userId);
    formData.append('action', 'DELETE_USER');

    fetch('admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    })
    .then(res => res.json())
    .then(result => {
        if (result.success) loadUsers();
        else alert('Failed to delete user.');
    });
}
    </script>
</body>
</html>
