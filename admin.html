<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteVerse - Admin Control Center</title>
    <!-- Link your project's main stylesheet here (update the path if needed, e.g., css/style.css) -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Fallback base styles matching a clean dashboard layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: white;
            text-decoration: none;
            background: #34495e;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
        }
        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #fcfcfc;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: white;
            margin-right: 5px;
        }
        .btn-primary { background-color: #3498db; }
        .btn-success { background-color: #2ecc71; }
        .btn-danger { background-color: #e74c3c; }
        .btn-warning { background-color: #f39c12; }
        .btn:hover { opacity: 0.9; }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 80%;
            height: 80%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 15px 20px;
            background: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .modal-body {
            flex: 1;
            padding: 10px;
            background: #eee;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <h2>NoteVerse Admin</h2>
        <a href="index.html">Back to Site</a>
    </header>

    <!-- Main Container -->
    <div class="container">
        <h1>Platform Control Center</h1>

        <!-- Pending Notes Section -->
        <div class="card">
            <div class="card-header">
                <h3>Pending Notes Queue</h3>
                <button class="btn btn-primary" onclick="loadPendingNotes()">Refresh</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Title / Details</th>
                        <th>Semester</th>
                        <th>Type</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="pendingTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #777;">Loading pending notes...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Student Directory Section -->
        <div class="card">
            <div class="card-header">
                <h3>Registered Students Directory</h3>
                <button class="btn btn-primary" onclick="loadUsers()">Refresh Users</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th style="text-align: center;">Manage Role / Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #777;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- PDF Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>PDF Preview</h3>
                <button onclick="closePreview()">&times;</button>
            </div>
            <div class="modal-body">
                <iframe id="pdfViewerFrame"></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadPendingNotes();
            loadUsers();
        });

        function loadPendingNotes() {
            fetch('admin/pending-notes')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('pendingTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">No pending notes waiting for approval.</td></tr>`;
                        return;
                    }

                    data.forEach(note => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <strong>\${note.title}</strong><br>
                                <small style="color: #666;">\${note.description || 'No description provided.'}</small>
                            </td>
                            <td>Sem \${note.semester}</td>
                            <td>\${note.noteType}</td>
                            <td style="text-align: center;">
                                <button class="btn btn-primary" onclick="previewPdf('\${note.filePath}')">Preview</button>
                                <button class="btn btn-success" onclick="moderateNote(\${note.noteId}, 'APPROVE')">Approve</button>
                                <button class="btn btn-danger" onclick="moderateNote(\${note.noteId}, 'DELETE')">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Error fetching pending notes:', err);
                    document.getElementById('pendingTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #e74c3c;">Failed to load pending notes.</td></tr>`;
                });
        }

        function moderateNote(noteId, action) {
            if (!confirm(`Are you sure you want to \${action.toLowerCase()} this note?`)) return;

            const formData = new URLSearchParams();
            formData.append('noteId', noteId);
            formData.append('action', action);

            fetch('admin/moderate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    loadPendingNotes();
                } else {
                    alert('Action failed: ' + result.message);
                }
            })
            .catch(err => alert('Network error occurred.'));
        }

        function loadUsers() {
            fetch('admin/users')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">No registered users found.</td></tr>`;
                        return;
                    }

                    data.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>\${user.fullName}</strong></td>
                            <td>\${user.email}</td>
                            <td>\${user.role}</td>
                            <td style="text-align: center;">
                                <button class="btn btn-warning" onclick="toggleRole(\${user.userId}, '\${user.role}')">Toggle Role</button>
                                <button class="btn btn-danger" onclick="deleteUser(\${user.userId})">Remove</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error('Error fetching users:', err));
        }

        function toggleRole(userId, currentRole) {
            const newRole = currentRole === 'ADMIN' ? 'STUDENT' : 'ADMIN';
            if (!confirm(`Change user role to \${newRole}?`)) return;

            const formData = new URLSearchParams();
            formData.append('userId', userId);
            formData.append('action', 'UPDATE_ROLE');
            formData.append('role', newRole);

            fetch('admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) loadUsers();
                else alert('Failed to update role.');
            });
        }

        function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user account?')) return;

            const formData = new URLSearchParams();
            formData.append('userId', userId);
            formData.append('action', 'DELETE_USER');

            fetch('admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) loadUsers();
                else alert('Failed to delete user.');
            });
        }

        function previewPdf(filePath) {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = filePath;
            modal.style.display = 'flex';
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
