<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center | NoteVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin-specific dashboard styling integrated with NoteVerse theme */
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
        }
        header.admin-header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header.admin-header h2 {
            font-family: 'Fraunces', serif;
            color: #f8fafc;
            margin: 0;
            font-size: 1.5rem;
        }
        header.admin-header a {
            color: #94a3b8;
            text-decoration: none;
            background: #334155;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            transition: background 0.2s;
        }
        header.admin-header a:hover {
            background: #475569;
            color: #fff;
        }
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            color: #f8fafc;
            margin-bottom: 1.5rem;
        }
        .admin-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .admin-card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
        }
        .admin-card-header h3 {
            margin: 0;
            font-family: 'Fraunces', serif;
            color: #cbd5e1;
            font-size: 1.25rem;
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        table.admin-table th, table.admin-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
        }
        table.admin-table th {
            background-color: #0f172a;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'IBM Plex Mono', monospace;
        }
        table.admin-table tr:hover {
            background-color: #26334d;
        }
        .admin-btn {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'IBM Plex Mono', monospace;
            color: white;
            margin-right: 0.25rem;
            transition: opacity 0.2s;
        }
        .btn-primary { background-color: #3b82f6; }
        .btn-success { background-color: #10b981; }
        .btn-danger { background-color: #f43f5e; }
        .btn-warning { background-color: #f59e0b; }
        .admin-btn:hover { opacity: 0.85; }

        /* Modal Styles */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .admin-modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            width: 80%;
            height: 80%;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .admin-modal-header {
            padding: 1rem 1.5rem;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-modal-header h3 {
            margin: 0;
            font-family: 'Fraunces', serif;
            color: #f8fafc;
        }
        .admin-modal-header button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .admin-modal-body {
            flex: 1;
            padding: 0.5rem;
            background: #0f172a;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="admin-header">
        <h2>NoteVerse Admin</h2>
        <a href="index.html">Back to Site</a>
    </header>

    <!-- Main Container -->
    <div class="admin-container">
        <h1>Platform Control Center</h1>

        <!-- Pending Notes Section -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h3>Pending Notes Queue</h3>
                <button class="admin-btn btn-primary" onclick="loadPendingNotes()">Refresh</button>
            </div>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Title / Details</th>
                        <th>Semester</th>
                        <th>Type</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="pendingTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Loading pending notes...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Student Directory Section -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h3>Registered Students Directory</h3>
                <button class="admin-btn btn-primary" onclick="loadUsers()">Refresh Users</button>
            </div>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th style="text-align: center;">Manage Role / Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- PDF Preview Modal -->
    <div id="previewModal" class="admin-modal">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3>PDF Preview</h3>
                <button onclick="closePreview()">&times;</button>
            </div>
            <div class="admin-modal-body">
                <iframe id="pdfViewerFrame"></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadPendingNotes();
            loadUsers();
        });

        function loadPendingNotes() {
            fetch('admin/pending-notes')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('pendingTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8;">No pending notes waiting for approval. Great job!</td></tr>`;
                        return;
                    }

                    data.forEach(note => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <strong style="color: #f8fafc;">\${note.title}</strong><br>
                                <small style="color: #94a3b8;">\${note.description || 'No description provided.'}</small>
                            </td>
                            <td>Sem \${note.semester}</td>
                            <td>\${note.noteType}</td>
                            <td style="text-align: center;">
                                <button class="admin-btn btn-primary" onclick="previewPdf('\${note.filePath}')">Preview</button>
                                <button class="admin-btn btn-success" onclick="moderateNote(\${note.noteId}, 'APPROVE')">Approve</button>
                                <button class="admin-btn btn-danger" onclick="moderateNote(\${note.noteId}, 'DELETE')">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Error fetching pending notes:', err);
                    document.getElementById('pendingTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #f43f5e;">Failed to load pending notes.</td></tr>`;
                });
        }

        function moderateNote(noteId, action) {
            if (!confirm(`Are you sure you want to \${action.toLowerCase()} this note?`)) return;

            const formData = new URLSearchParams();
            formData.append('noteId', noteId);
            formData.append('action', action);

            fetch('admin/moderate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    loadPendingNotes();
                } else {
                    alert('Action failed: ' + result.message);
                }
            })
            .catch(err => alert('Network error occurred.'));
        }

        function loadUsers() {
            fetch('admin/users')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8;">No registered users found.</td></tr>`;
                        return;
                    }

                    data.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong style="color: #f8fafc;">\${user.fullName}</strong></td>
                            <td>\${user.email}</td>
                            <td>\${user.role}</td>
                            <td style="text-align: center;">
                                <button class="admin-btn btn-warning" onclick="toggleRole(\${user.userId}, '\${user.role}')">Toggle Role</button>
                                <button class="admin-btn btn-danger" onclick="deleteUser(\${user.userId})">Remove</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error('Error fetching users:', err));
        }

        function toggleRole(userId, currentRole) {
            const newRole = currentRole === 'ADMIN' ? 'STUDENT' : 'ADMIN';
            if (!confirm(`Change user role to \${newRole}?`)) return;

            const formData = new URLSearchParams();
            formData.append('userId', userId);
            formData.append('action', 'UPDATE_ROLE');
            formData.append('role', newRole);

            fetch('admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) loadUsers();
                else alert('Failed to update role.');
            });
        }

        function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user account?')) return;

            const formData = new URLSearchParams();
            formData.append('userId', userId);
            formData.append('action', 'DELETE_USER');

            fetch('admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) loadUsers();
                else alert('Failed to delete user.');
            });
        }

        function previewPdf(filePath) {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = filePath;
            modal.style.display = 'flex';
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
