<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | NoteVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== HEADER / NAVIGATION ===================== -->
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">NoteVerse</a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="notes-explorer.html">Browse BCA Notes</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="my-account.html">My Account</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-card" style="max-width: 480px; margin: 3rem auto;">
            <h2>Forgot your password?</h2>
            <p>Enter the email you registered with and we'll send you a link to choose a new password.</p>

            <form id="forgotForm" novalidate>
                <div class="field-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <span class="field-error" id="emailError"></span>
                </div>

                <p class="form-status" id="formStatus"></p>

                <button type="submit" class="auth-submit" id="submitBtn">Send Reset Link</button>
            </form>

            <p style="margin-top: 1.25rem;"><a href="login.html">&larr; Back to login</a></p>
        </div>
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer>
        <p>&copy; 2026 NoteVerse. Built for BCA students, by a BCA student.</p>
    </footer>

    <script>
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const statusEl = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');

        const RESEND_SECONDS = 60; // matches the server-side one-request-per-minute limit

        function setStatus(message, ok) {
            statusEl.textContent = message;
            statusEl.className = 'form-status ' + (ok ? 'form-status-success' : 'form-status-error');
        }

        function startCooldown() {
            let remaining = RESEND_SECONDS;
            submitBtn.disabled = true;
            const timer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(timer);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                } else {
                    submitBtn.textContent = `Resend available in ${remaining}s`;
                }
            }, 1000);
            submitBtn.textContent = `Resend available in ${remaining}s`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            emailError.textContent = '';
            statusEl.textContent = '';
            statusEl.className = 'form-status';

            const email = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                emailError.textContent = 'Enter a valid email address.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending…';

            try {
                const response = await fetch('forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                let result;
                try {
                    result = await response.json();
                } catch {
                    result = { success: false, message: 'Something went wrong. Please try again.' };
                }

                if (response.ok && result.success) {
                    setStatus(result.message, true);
                    startCooldown();
                } else {
                    setStatus(result.message || 'Something went wrong. Please try again.', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            } catch (err) {
                setStatus('Could not reach the server. Please try again in a moment.', false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>

</body>
</html>
