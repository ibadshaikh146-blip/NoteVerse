<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Details | NoteVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== HEADER / NAVIGATION ===================== -->
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">NoteVerse</a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="notes-explorer.html">Browse BCA Notes</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="my-account.html">My Account</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="detail-wrapper">

            <a href="notes-explorer.html" class="back-link">&larr; Back to Browse</a>

            <div class="detail-layout">

                <!-- ===================== MAIN DETAIL CARD ===================== -->
                <article class="detail-card" id="detailCard">
                    <p class="explorer-status" id="loadingStatus">Loading note…</p>
                </article>

            </div>
        </div>
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer>
        <p>&copy; 2026 NoteVerse. Built for BCA students, by a BCA student.</p>
    </footer>

    <script>
        const TYPE_LABELS = {
            NOTES: 'Notes',
            SLIDES: 'Slides',
            QUESTION_PAPER: 'Question Paper',
            LAB_MANUAL: 'Lab Manual'
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatUploadDate(isoDate) {
            if (!isoDate) return 'Recently uploaded';
            const date = new Date(isoDate);
            if (Number.isNaN(date.getTime())) return 'Recently uploaded';
            return date.toLocaleDateString('en-IN', {
                day: 'numeric', month: 'short', year: 'numeric'
            });
        }

        async function loadNote() {
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('id');
            const card = document.getElementById('detailCard');

            if (!noteId) {
                card.innerHTML = '<p class="explorer-status">No note specified.</p>';
                return;
            }

            try {
                const response = await fetch(`note-detail?id=${encodeURIComponent(noteId)}`);
                if (!response.ok) {
                    card.innerHTML = '<p class="explorer-status">This note could not be found, or is no longer available.</p>';
                    return;
                }
                const note = await response.json();
                renderNote(note);
            } catch (err) {
                card.innerHTML = '<p class="explorer-status">Could not load this note. Please try again.</p>';
            }
        }

        function renderNote(note) {
            const card = document.getElementById('detailCard');
            const typeLabel = TYPE_LABELS[note.noteType] || note.noteType;
            const downloadUrl = `download?id=${note.noteId}`;

            card.innerHTML = `
                <div class="resource-card-top">
                    <span class="resource-type-tag">${escapeHtml(typeLabel)}</span>
                    <span class="resource-code">${escapeHtml(note.subjectName)} &bull; Semester ${note.semester}</span>
                </div>

                <h1>${escapeHtml(note.title)}</h1>

                <div class="resource-meta detail-meta">
                    <span>Uploaded by ${escapeHtml(note.uploaderName)}</span>
                    <span>&bull;</span>
                    <span>${escapeHtml(formatUploadDate(note.uploadDate))}</span>
                    <span>&bull;</span>
                    <span>${note.downloadCount} download${note.downloadCount === 1 ? '' : 's'}</span>
                </div>

                <div class="detail-actions">
                    <a href="${downloadUrl}" class="btn-download">Download PDF</a>
                    <button type="button" class="btn-bookmark" data-note-id="${note.noteId}" aria-label="Bookmark this note">&#9825;</button>
                </div>

                <hr class="detail-divider">

                <section class="detail-description">
                    <h2>Description</h2>
                    <p>${escapeHtml(note.description) || 'No description provided.'}</p>
                </section>
            `;

            wireBookmarkButton();
        }

        function wireBookmarkButton() {
            const btn = document.querySelector('.btn-bookmark');
            if (!btn) return;

            // Check current bookmark state
            fetch('bookmarks').then(async (res) => {
                if (!res.ok) return; // not logged in
                const bookmarked = await res.json();
                const noteId = Number(btn.dataset.noteId);
                if (bookmarked.some(n => n.noteId === noteId)) {
                    btn.classList.add('bookmarked');
                    btn.innerHTML = '&#9829;';
                }
            }).catch(() => {});

            btn.addEventListener('click', async () => {
                btn.disabled = true;
                try {
                    const response = await fetch('bookmarks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ noteId: Number(btn.dataset.noteId) })
                    });
                    if (response.status === 401) {
                        window.location.href = 'login.html';
                        return;
                    }
                    const result = await response.json();
                    if (result.success) {
                        btn.classList.toggle('bookmarked', result.bookmarked);
                        btn.innerHTML = result.bookmarked ? '&#9829;' : '&#9825;';
                    }
                } catch (err) {
                    // leave as-is
                } finally {
                    btn.disabled = false;
                }
            });
        }

        loadNote();
    </script>

</body>
</html>
