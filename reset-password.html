<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | NoteVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== HEADER / NAVIGATION ===================== -->
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">NoteVerse</a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="notes-explorer.html">Browse BCA Notes</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="my-account.html">My Account</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-card" style="max-width: 480px; margin: 3rem auto;">
            <h2>Choose a new password</h2>

            <p class="explorer-status" id="checkingStatus">Checking your reset link…</p>

            <!-- Shown if the link is bad or expired -->
            <div id="invalidBox" hidden>
                <p class="form-status form-status-error">This reset link is invalid or has expired.</p>
                <p><a href="forgot-password.html">Request a new reset link</a></p>
            </div>

            <!-- Shown only when the link is valid -->
            <form id="resetForm" novalidate hidden>
                <div class="field-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                    <span class="field-error" id="confirmError"></span>
                </div>

                <p class="form-status" id="formStatus"></p>

                <button type="submit" class="auth-submit" id="submitBtn">Update Password</button>
            </form>
        </div>
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer>
        <p>&copy; 2026 NoteVerse. Built for BCA students, by a BCA student.</p>
    </footer>

    <script>
        const token = new URLSearchParams(window.location.search).get('token') || '';

        const checkingStatus = document.getElementById('checkingStatus');
        const invalidBox = document.getElementById('invalidBox');
        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const statusEl = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');

        function setStatus(message, ok) {
            statusEl.textContent = message;
            statusEl.className = 'form-status ' + (ok ? 'form-status-success' : 'form-status-error');
        }

        async function checkToken() {
            try {
                const response = await fetch('reset-password?token=' + encodeURIComponent(token));
                const data = await response.json();
                checkingStatus.hidden = true;
                if (data.valid) {
                    form.hidden = false;
                } else {
                    invalidBox.hidden = false;
                }
            } catch (err) {
                checkingStatus.hidden = true;
                invalidBox.hidden = false;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            passwordError.textContent = '';
            confirmError.textContent = '';
            statusEl.textContent = '';
            statusEl.className = 'form-status';

            const password = passwordInput.value;
            const confirm = confirmInput.value;

            let valid = true;
            if (password.length < 8) {
                passwordError.textContent = 'Password must be at least 8 characters.';
                valid = false;
            }
            if (password !== confirm) {
                confirmError.textContent = 'Passwords do not match.';
                valid = false;
            }
            if (!valid) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating…';

            try {
                const response = await fetch('reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                let result;
                try {
                    result = await response.json();
                } catch {
                    result = { success: false, message: 'Something went wrong. Please try again.' };
                }

                if (response.ok && result.success) {
                    setStatus(result.message, true);
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    setStatus(result.message || 'Something went wrong. Please try again.', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password';
                }
            } catch (err) {
                setStatus('Could not reach the server. Please try again in a moment.', false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        });

        checkToken();
    </script>

</body>
</html>
